author: Santiago Riobó
role: >-
  Director Ejecutivo de Faro País | Asesor Polítco del Senado de la Nación
  Argentina
text: >-
  Argentina: Es necesario otro tipo de discusión. Venimos de discusiones, hace
  muchos años en nuestro país, en donde se polariza en el famoso péndulo
  izquierda-derecha. La discusión tiene que ser: que proyecto ponemos para
  nuestro país.

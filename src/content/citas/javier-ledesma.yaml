author: Javier Ledesma
role: Licenciado en Comunicación Periodística | Creador de contenidos
text: >-
  Entiendo que vende mucho hablar de monopolios dentro de los distintos
  negocios, pero lo cierto es que no sé si hay realmente un monopolio, o sea,
  una empresa que controla 100% del mercado. Lo que hay mucho en muchos negocios
  de Argentina es posiciones dominantes, o al menos oligopolios.
